<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>HABIX AI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1019; color: #f4f7ff; font: 15px/1.5 "Segoe UI", sans-serif; }
    main { text-align: center; }
    .mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 18px; background: linear-gradient(145deg, #8367ff, #4f8dff); font-size: 25px; font-weight: 800; box-shadow: 0 12px 36px #6d5cff44; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    p { margin: 8px 0 0; color: #9ba7bc; }
    .dot { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: #8c7bff; animation: pulse 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 50% { opacity: .25; transform: translateY(-3px); } }
  </style>
</head>
<body><main><div class="mark">H</div><h1>HABIX AI</h1><p>Getting your study space ready <span class="dot"></span><span class="dot"></span><span class="dot"></span></p></main></body>
</html>
