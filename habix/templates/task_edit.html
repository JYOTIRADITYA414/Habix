{% extends 'base.html' %}{% block title %}Edit task{% endblock %}{% block crumb %}<a href="{{ url_for('main.tasks') }}">Tasks</a> / Edit{% endblock %}
{% block content %}<section class="page-heading"><div><div class="eyebrow">MAKE A QUICK UPDATE</div><h1>Edit task</h1><p class="muted">Adjust the details as your plans change.</p></div><a class="button button-soft" href="{{ url_for('main.tasks') }}"><i data-lucide="arrow-left"></i> Back to tasks</a></section><section class="panel form-panel narrow-panel"><form method="post" class="form-grid">{{ csrf_field() }}<label class="field-label span-2">Title<input name="title" maxlength="180" required value="{{ task.title }}"></label><label class="field-label span-2">Description<textarea name="description" rows="4" maxlength="3000">{{ task.description }}</textarea></label><label class="field-label">Due date<input type="date" name="due_date" value="{{ task.due_date or '' }}"></label><label class="field-label">Due time<input type="time" name="due_time" value="{{ task.due_time or '' }}"></label><label class="field-label">Priority<select name="priority">{% for p in priorities %}<option {% if task.priority == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label><label class="field-label">Status<select name="status">{% for s in statuses %}<option {% if task.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label class="field-label">Category<input name="category" maxlength="60" value="{{ task.category }}"></label><label class="field-label">Subject<input name="subject" maxlength="100" value="{{ task.subject }}"></label><div class="span-2 form-bottom"><span></span><button class="button button-primary">Save changes</button></div></form></section>{% endblock %}
